name: Chrome Web Store

on:
  workflow_dispatch:
    inputs:
      action:
        description: Build, verify publisher access, upload a draft, or submit for review
        type: choice
        options: [build, verify, upload, publish]
        default: upload
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: chrome-webstore
  cancel-in-progress: false

jobs:
  release:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      WXT_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - name: Build store package
        run: |
          test -n "$WXT_GOOGLE_OAUTH_CLIENT_ID"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=$(node -p "require('./packages/extension/package.json').version")
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          pnpm zip:extension
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chrome-webstore-package
          path: packages/extension/.output/adp-shifts-*-chrome.zip
          if-no-files-found: error
          include-hidden-files: true
      - name: Build userscript
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export TAG_VERSION="${GITHUB_REF_NAME#v}"
          fi
          pnpm build:userscript
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: userscript-package
          path: packages/userscript/dist/adp-schedule-export.user.js
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            packages/userscript/dist/adp-schedule-export.user.js \
            packages/extension/.output/adp-shifts-*-chrome.zip \
            --title "ADP Shifts $GITHUB_REF_NAME" \
            --generate-notes || \
          gh release upload "$GITHUB_REF_NAME" \
            packages/userscript/dist/adp-schedule-export.user.js \
            packages/extension/.output/adp-shifts-*-chrome.zip \
            --clobber
      - name: Verify publisher access
        if: inputs.action != 'build'
        run: pnpm store:status
        env:
          EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
      - name: Upload store draft
        if: startsWith(github.ref, 'refs/tags/v') || inputs.action == 'upload' || inputs.action == 'publish'
        run: pnpm store:upload
        env:
          EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
      - name: Submit for review
        if: startsWith(github.ref, 'refs/tags/v') || inputs.action == 'publish'
        run: pnpm store:publish
        env:
          EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
