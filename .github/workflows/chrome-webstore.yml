name: Chrome Web Store

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Submit the uploaded package for store review
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: chrome-webstore
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      WXT_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - name: Build store package
        run: |
          test -n "$WXT_GOOGLE_OAUTH_CLIENT_ID"
          pnpm zip:extension
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-webstore-package
          path: packages/extension/.output/adp-shifts-*-chrome.zip
          if-no-files-found: error
      - name: Upload store draft
        run: pnpm store:upload
        env:
          EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
      - name: Submit for review
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        run: pnpm store:publish
        env:
          EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
