name: Chrome Web Store

on:
  workflow_dispatch:
    inputs:
      action:
        description: Build a package, upload a draft, or upload and submit for review
        type: choice
        options: [build, upload, publish]
        default: upload
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: chrome-webstore
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      WXT_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - name: Build store package
        run: |
          test -n "$WXT_GOOGLE_OAUTH_CLIENT_ID"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=$(node -p "require('./packages/extension/package.json').version")
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          pnpm zip:extension
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-webstore-package
          path: packages/extension/.output/adp-shifts-*-chrome.zip
          if-no-files-found: error
      - name: Upload store draft
        if: inputs.action != 'build'
        run: pnpm store:upload
        env:
          EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
      - name: Submit for review
        if: startsWith(github.ref, 'refs/tags/v') || inputs.action == 'publish'
        run: pnpm store:publish
        env:
          EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
