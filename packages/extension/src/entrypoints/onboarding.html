<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Set up ADP Shifts</title>
    <link rel="stylesheet" href="../onboarding/onboarding.css" />
  </head>
  <body>
    <main>
      <h1 id="title"></h1>
      <ol id="steps">
        <li id="step-adp" data-step="adp-signed-in">
          <h2 id="adp-title"></h2>
          <p id="adp-body"></p>
          <button id="open-adp" type="button"></button>
          <p id="adp-confirmed" hidden></p>
        </li>
        <li id="step-schedule" data-step="my-schedule">
          <h2 id="schedule-title"></h2>
          <p id="schedule-body"></p>
          <figure class="calendar-guide" aria-labelledby="calendar-guide-caption">
            <div class="adp-navigation" role="img" id="calendar-guide">
              <span class="adp-wordmark">ADP</span>
              <span class="nav-item"><span aria-hidden="true">✓</span><span id="things-to-do-nav"></span></span>
              <span class="nav-item nav-calendar"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 2v6M16 2v6M4 11h16"/></svg><span id="calendar-nav"></span></span>
            </div>
            <figcaption id="calendar-guide-caption"></figcaption>
          </figure>
          <button id="open-schedule" type="button"></button>
          <p id="position-captured" hidden></p>
        </li>
        <li id="step-google" data-step="google">
          <h2 id="google-title"></h2>
          <p id="google-body"></p>
          <button id="connect-google" type="button"></button>
          <p id="google-connected" hidden></p>
          <button id="google-sign-out" type="button" hidden></button>
          <p id="google-status" role="status"></p>
        </li>
        <li id="step-sync" data-step="first-sync">
          <h2 id="sync-title"></h2>
          <p id="sync-body"></p>
          <button id="first-sync" type="button"></button>
          <p id="sync-done" hidden></p>
          <p id="sync-status" role="status"></p>
        </li>
      </ol>
      <p id="done" hidden></p>
      <section>
        <h2 id="settings-title"></h2>
        <label id="time-zone-label" for="time-zone"></label>
        <select id="time-zone" name="time-zone"></select>
        <p id="time-zone-help"></p>
        <button id="use-browser-time-zone" type="button"></button>
        <button id="save-time-zone" type="button"></button>
        <p id="time-zone-status" role="status"></p>
        <p id="disconnect-help"></p>
        <button id="disconnect" type="button"></button>
        <p id="disconnect-status" role="status"></p>
      </section>
    </main>
    <script type="module" src="../onboarding/main.ts"></script>
  </body>
</html>
